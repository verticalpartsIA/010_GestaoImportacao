<!-- WORKFLOW -->
<rect x="32" y="1080" width="760" height="445" rx="18" fill="#fff" stroke="#e5e7eb"/>
<text x="58" y="1120" class="s">WORKFLOW — COMO OS DADOS FLUEM</text>
<text x="58" y="1155" class="h">HERDA DADOS DE</text>
<rect x="60" y="1180" width="300" height="60" rx="10" fill="#fafaff" stroke="#ddd6fe"/><text x="78" y="1205" class="h">Formulários</text><text x="78" y="1227" class="xs">Cliente, obra, unidades e especificações técnicas.</text>
<rect x="60" y="1252" width="300" height="60" rx="10" fill="#fafaff" stroke="#ddd6fe"/><text x="78" y="1277" class="h">Cadastros</text><text x="78" y="1299" class="xs">Cliente e fornecedor conhecidos.</text>
<rect x="60" y="1324" width="300" height="60" rx="10" fill="#fafaff" stroke="#ddd6fe"/><text x="78" y="1349" class="h">Master ID / Nº Cotação</text><text x="78" y="1371" class="xs">Identidade do ativo e rastreabilidade.</text>
<rect x="390" y="1250" width="160" height="88" rx="18" fill="url(#g)"/><text x="470" y="1286" class="n" text-anchor="middle">COTAÇÕES</text><text x="470" y="1311" class="n" text-anchor="middle">A FORNECEDOR</text>
<text x="575" y="1155" class="h">DOA DADOS PARA</text>
<rect x="565" y="1180" width="200" height="55" rx="10" fill="#f8fafc" stroke="#dbeafe"/><text x="580" y="1204" class="h">Precificação</text><text x="580" y="1225" class="xs">Custos respondidos.</text>
<rect x="565" y="1245" width="200" height="55" rx="10" fill="#f8fafc" stroke="#dbeafe"/><text x="580" y="1269" class="h">Propostas</text><text x="580" y="1290" class="xs">Base técnica/comercial.</text>
<rect x="565" y="1310" width="200" height="55" rx="10" fill="#f8fafc" stroke="#dbeafe"/><text x="580" y="1334" class="h">Central de Decisões</text><text x="580" y="1355" class="xs">Aprovações quando exigidas.</text>
<rect x="565" y="1375" width="200" height="55" rx="10" fill="#f8fafc" stroke="#dbeafe"/><text x="580" y="1399" class="h">Gatilhos &amp; Prazo</text><text x="580" y="1420" class="xs">Eventos e prazos.</text>
<rect x="565" y="1440" width="200" height="55" rx="10" fill="#f8fafc" stroke="#dbeafe"/><text x="580" y="1464" class="h">P.I. / Compra</text><text x="580" y="1485" class="xs">Continuidade após aprovação.</text>
<line x1="360" y1="1294" x2="390" y2="1294" stroke="#818cf8" stroke-width="3"/><line x1="550" y1="1294" x2="565" y2="1294" stroke="#818cf8" stroke-width="3"/>

<rect x="815" y="1080" width="750" height="445" rx="18" fill="#fff" stroke="#e5e7eb"/>
<text x="840" y="1120" class="s">CICLO REAL DA COTAÇÃO</text>
<text x="850" y="1170" class="h">1. Nasce do Formulário</text><text x="850" y="1194" class="sm">Reaproveita dados técnicos já coletados.</text>
<text x="850" y="1235" class="h">2. Envio ao Fornecedor</text><text x="850" y="1259" class="sm">A solicitação passa a ser rastreada.</text>
<text x="850" y="1300" class="h">3. Visualização</text><text x="850" y="1324" class="sm">O fornecedor acessa a solicitação.</text>
<text x="850" y="1365" class="h">4. Resposta</text><text x="850" y="1389" class="sm">Valores e condições retornam ao sistema.</text>
<text x="1190" y="1170" class="h">5. Tratativas</text><text x="1190" y="1194" class="sm">Negociação, mensagens e anexos.</text>
<text x="1190" y="1235" class="h">6. Em análise</text><text x="1190" y="1259" class="sm">A empresa avalia se seguirá com a compra.</text>
<text x="1190" y="1300" class="h">7. Aprovada</text><text x="1190" y="1324" class="sm">Compra confirmada internamente.</text>
<text x="1190" y="1380" class="h">Regra de ouro</text><text x="1190" y="1404" class="sm">Recebida ≠ Aprovada.</text><text x="1190" y="1424" class="sm">A resposta do fornecedor ainda precisa</text><text x="1190" y="1444" class="sm">ser analisada antes de seguir no workflow.</text>

<!-- BOTTOM -->
<rect x="32" y="1560" width="500" height="395" rx="18" fill="#fff" stroke="#e5e7eb"/>
<text x="58" y="1600" class="s">COMO UTILIZAR — PASSO A PASSO</text>
<text x="60" y="1650" class="b">1. Abra Cotações a Fornecedor.</text><text x="60" y="1690" class="b">2. Localize a cotação pelos filtros.</text><text x="60" y="1730" class="b">3. Confira o status atual.</text><text x="60" y="1770" class="b">4. Clique na linha para abrir o detalhe.</text><text x="60" y="1810" class="b">5. Revise os dados técnicos enviados.</text><text x="60" y="1850" class="b">6. Consulte Tratativas e anexos.</text><text x="60" y="1890" class="b">7. Encaminhe resposta válida para análise/precificação.</text>

<rect x="550" y="1560" width="500" height="395" rx="18" fill="#fff" stroke="#e5e7eb"/>
<text x="576" y="1600" class="s">STATUS E SIGNIFICADO</text>
<text x="580" y="1650" class="h">Aguardando</text><text x="580" y="1672" class="sm">Fornecedor ainda não respondeu.</text>
<text x="580" y="1720" class="h">Recebida</text><text x="580" y="1742" class="sm">Resposta chegou e está pronta para avaliação.</text>
<text x="580" y="1790" class="h">Em análise</text><text x="580" y="1812" class="sm">A VerticalParts decidiu avaliar/seguir com a compra.</text>
<text x="580" y="1860" class="h">Aprovada</text><text x="580" y="1882" class="sm">Compra confirmada internamente.</text>

<rect x="1068" y="1560" width="497" height="395" rx="18" fill="#fff" stroke="#e5e7eb"/>
<text x="1094" y="1600" class="s">DICAS IMPORTANTES</text>
<text x="1096" y="1650" class="sm">✓ Não redigite dados que já vieram do Formulário.</text>
<text x="1096" y="1690" class="sm">✓ Use Tratativas para preservar a negociação.</text>
<text x="1096" y="1730" class="sm">✓ Não confunda resposta recebida com compra aprovada.</text>
<text x="1096" y="1770" class="sm">✓ Confira Nº da Cotação / Master ID antes de avançar.</text>
<text x="1096" y="1810" class="sm">✓ Use filtros para reduzir ruído operacional.</text>
<text x="1096" y="1850" class="sm">✓ Só dados confirmados devem alimentar a Precificação.</text>

<!-- FOOTER -->
<rect x="32" y="1990" width="1733" height="150" rx="18" fill="url(#g)"/>
<text x="60" y="2030" class="h" fill="#fff">IMPORTANTE</text>
<text x="60" y="2060" class="b" fill="#fff">Cotações a Fornecedor é a ponte entre a especificação técnica e o custo real informado pelo fornecedor.</text>
<text x="60" y="2085" class="b" fill="#fff">O valor da tela está também na rastreabilidade: quem enviou, quem respondeu, o que foi negociado e qual decisão veio depois.</text>
<text x="1210" y="2030" class="h" fill="#fff">SVG VETORIAL</text>
<text x="1210" y="2060" class="sm" fill="#fff">Ideal para Supabase Storage,</text><text x="1210" y="2082" class="sm" fill="#fff">browser, modal ou nova aba.</text>
</svg>
