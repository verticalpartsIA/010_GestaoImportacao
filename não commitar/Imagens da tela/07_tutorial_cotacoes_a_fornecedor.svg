<text x="130" y="62" class="h">GUIA COMPLETO DA TELA</text>
<text x="130" y="112" class="t">Cotações a Fornecedor</text>
<text x="130" y="145" class="b">Solicitações técnicas, respostas, negociação e decisão de compra em um único fluxo rastreável.</text>

<text x="760" y="62" class="h">O QUE É ESTA TELA?</text>
<text x="760" y="94" class="b">Centraliza as cotações técnicas enviadas aos fornecedores.</text>
<text x="760" y="116" class="b">Hoje o fluxo real está implementado para elevadores/Glarie,</text>
<text x="760" y="138" class="b">mas a arquitetura já prevê outras categorias de equipamentos.</text>

<rect x="1225" y="35" width="340" height="120" rx="18" fill="#10142c"/>
<text x="1248" y="68" class="h" fill="#fff">? COMO USAR ESTA CARTILHA</text>
<text x="1248" y="96" class="sm" fill="#e5e7eb">Entenda cada elemento da tela,</text>
<text x="1248" y="116" class="sm" fill="#e5e7eb">de onde os dados vêm e para onde</text>
<text x="1248" y="136" class="sm" fill="#e5e7eb">eles seguem no workflow.</text>

