<!doctype html>
<html lang="pt-br">

  <script>
    (function () {
      const URL_SB  = 'https://jxtqwzmpgofwctqajewt.supabase.co';

  <script src="/src/eventos-fluxo-store.js?v=6"></script>
  <script src="/src/contrato-instalador-engine.js?v=2"></script>

       link (achado 21/08, conferindo a LEGADO-405 em produção). -->
  <script src="/src/proposta-legado.js?v=1"></script>

  <script src="/src/proposta-imagens.js?v=1"></script>

       branco (achado 21/08: o cliente recebia um PDF pior que o do
