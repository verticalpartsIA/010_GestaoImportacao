<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Solicite orçamento de Quadro de Comando — VerticalParts">
  <meta name="robots" content="noindex, nofollow">
  <title>Solicitar Orçamento — Quadro de Comando · VerticalParts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --vp-yellow: #F5C400;
      --vp-yellow-bright: #FFD400;
      --vp-yellow-press: #C99E00;
      --vp-yellow-tint: #FFF6CC;
      --vp-black: #000000;
      --vp-white: #FFFFFF;
      --gray-50: #F9F9F9;
      --gray-100: #F2F2F2;
      --gray-200: #E5E5E5;
      --gray-300: #C9C9C9;
      --gray-500: #808080;
      --gray-700: #4A4A4A;
      --gray-900: #1F1F1F;
      --danger: #C62828;
      --danger-tint: #FDECEA;
      --success: #2E7D32;
      --success-tint: #E8F5E9;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: auto; overflow: auto; }
    body {
      font-family: 'Poppins', 'Inter', Arial, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
    }
    header.fqc-header {
      background: var(--vp-black);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    header.fqc-header img { height: 32px; display: block; }
    header.fqc-header .tag { font-size: 11px; color: var(--vp-yellow); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
    .fqc-hero {
      background: linear-gradient(135deg, var(--vp-black) 0%, #1a1a1a 60%, #000 100%);
      padding: 48px 24px 40px; text-align: center;
    }
    .fqc-hero h1 { font-size: 34px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .fqc-hero h1 em { color: var(--vp-yellow); font-style: normal; }
    .fqc-hero p { font-size: 15px; color: #cfcfcf; max-width: 560px; margin: 0 auto; line-height: 1.6; }
    #fqc-root { max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }
  </style>
</head>
<body>
  <header class="fqc-header">
    <img src="/assets/logo-verticalparts-white.png" alt="VerticalParts">
    <div class="tag">Orçamento · Quadro de Comando</div>
  </header>
  <div class="fqc-hero">
    <h1>Solicite seu <em>Orçamento</em></h1>
    <p>Preencha as informações técnicas do seu quadro de comando para receber uma proposta precisa da nossa equipe comercial.</p>
  </div>
  <div id="fqc-root">
    <div style="text-align:center; padding:60px 0; color:#888; font-size:13px;">Carregando…</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="/src/enderecos-api.js?v=3"></script>
  <script type="text/babel" src="/src/formulario-quadro-comando-publico.jsx?v=1"></script>
</body>
</html>
