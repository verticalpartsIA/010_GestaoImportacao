name: Dependency Review

# DESATIVADO: o Dependency Review exige GitHub Code Security em repositórios
# privados, indisponível no plano atual. A checagem de dependências foi
# substituída pelo workflow "Security — npm audit e Gitleaks".
# Para reativar, restaure o gatilho abaixo:
#   pull_request: { branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: read
  # necessário para comentar o resumo no PR em caso de falha
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
