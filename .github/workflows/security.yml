name: Security — npm audit e Gitleaks

# Alternativas gratuitas ao CodeQL / Dependency Review / Secret Scanning,
# que exigem GitHub Code Security em repositórios privados.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira, 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Dependências de produção: falha se houver vulnerabilidade alta ou crítica
      - name: Audit (produção — bloqueia em high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Dependências de desenvolvimento: apenas informativo
      - name: Audit (completo — informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks (secrets no código e no histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact oculta os valores nos logs; o job falha se encontrar algo
      - name: Procurar secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
