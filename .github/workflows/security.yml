name: Security — npm audit e Gitleaks

# Alternativas gratuitas ao CodeQL / Dependency Review / Secret Scanning,
# que exigem GitHub Code Security em repositórios privados.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira, 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Dependências de produção: falha se houver vulnerabilidade alta ou crítica
      - name: Audit (produção — bloqueia em high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Dependências de desenvolvimento: apenas informativo
      - name: Audit (completo — informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks (secrets no código e no histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # O relatório JSON (com os valores) fica somente no runner, em RUNNER_TEMP.
      # Nada com valor é impresso no log; o stdout do gitleaks mostra só a contagem.
      - name: Procurar secrets
        run: |
          rc=0
          ./gitleaks detect --source . --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" \
            --exit-code 1 || rc=$?
          echo "GITLEAKS_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      # Resumo SEGURO: classifica cada achado sem imprimir o valor.
      # JWT -> imprime só o papel (role) e o ref do projeto.
      # Outros -> imprime só o nome da variável e o tipo/tamanho.
      - name: Resumo dos achados (sem valores)
        run: |
          python3 - <<'PY'
          import json, os, re, base64, collections

          p = os.path.join(os.environ["RUNNER_TEMP"], "gitleaks.json")
          data = json.load(open(p)) if os.path.exists(p) else []

          def jwt_info(tok):
              try:
                  part = tok.split(".")[1]
                  part += "=" * (-len(part) % 4)
                  pl = json.loads(base64.urlsafe_b64decode(part))
                  return f"JWT role={pl.get('role', '?')} ref={pl.get('ref', '?')} exp={'sim' if 'exp' in pl else 'nao'}"
              except Exception:
                  return "JWT (não decodificável)"

          def classify(secret):
              s = secret or ""
              if s.startswith("eyJ") and s.count(".") == 2:
                  return jwt_info(s)
              if s.startswith("sb_secret_"):
                  return "Supabase SECRET key (sb_secret_) !!!"
              if s.startswith("sb_publishable_"):
                  return "Supabase publishable key (pública)"
              return f"outro (len={len(s)})"

          def varname(match, secret):
              m = match or ""
              if secret and secret in m:
                  m = m.split(secret)[0]
              ids = re.findall(r"([A-Za-z_][\w.\-]*)\s*[\"']?\s*[:=]", m)
              return ids[-1] if ids else "-"

          rows = collections.OrderedDict()
          for d in data:
              rec = (d["RuleID"], d["File"], d.get("StartLine"), varname(d.get("Match"), d.get("Secret")), classify(d.get("Secret")))
              rows.setdefault(rec, set()).add(d["Commit"][:7])

          print(f"Total de achados: {len(data)}\n")
          print("== Classificação (regra | arquivo:linha | variável | tipo | no código hoje?) ==")
          for (rule, f, line, var, kind), commits in sorted(rows.items(), key=lambda x: (x[0][4], x[0][1], x[0][2] or 0)):
              hoje = "NO CÓDIGO" if os.path.exists(f) else "só histórico"
              print(f"{kind} | {rule} | {f}:{line} | var={var} | {hoje} | commits={sorted(commits)[:3]}")

          print("\n== Contagem por tipo ==")
          c = collections.Counter(k[4] for k in rows)
          for k, n in c.most_common():
              print(f"{n:4d}  {k}")
          PY

      - name: Falhar se houver achados
        run: |
          if [ "${GITLEAKS_RC:-0}" != "0" ]; then
            echo "Gitleaks encontrou possíveis secrets (veja o resumo acima)."
            exit 1
          fi
