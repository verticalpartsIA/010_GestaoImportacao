name: Security — npm audit e Gitleaks

# Alternativas gratuitas ao CodeQL / Dependency Review / Secret Scanning,
# que exigem GitHub Code Security em repositórios privados.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira, 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Dependências de produção: falha se houver vulnerabilidade alta ou crítica
      - name: Audit (produção — bloqueia em high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Dependências de desenvolvimento: apenas informativo
      - name: Audit (completo — informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks (secrets no código e no histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact oculta os valores; o relatório JSON fica só no runner.
      - name: Procurar secrets
        run: |
          rc=0
          ./gitleaks detect --source . --redact --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" \
            --exit-code 1 || rc=$?
          echo "GITLEAKS_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      # Resumo SEGURO: só tipo da regra, arquivo, quantidade, commits e se o
      # arquivo ainda existe hoje. Nunca imprime Secret/Match.
      - name: Resumo dos achados (sem valores)
        run: |
          python3 - <<'PY'
          import json, os, collections
          p = os.path.join(os.environ["RUNNER_TEMP"], "gitleaks.json")
          data = json.load(open(p)) if os.path.exists(p) else []
          print(f"Total de achados: {len(data)}\n")
          by_rule = collections.Counter(d["RuleID"] for d in data)
          print("== Por tipo de regra ==")
          for r, n in by_rule.most_common():
              print(f"{n:4d}  {r}")
          groups = collections.defaultdict(lambda: {"n": 0, "lines": set(), "commits": set()})
          for d in data:
              g = groups[(d["RuleID"], d["File"])]
              g["n"] += 1
              g["lines"].add(d.get("StartLine"))
              g["commits"].add(d["Commit"][:7])
          print("\n== Por regra + arquivo ==")
          for (r, f), g in sorted(groups.items()):
              exists = "AINDA NO CÓDIGO" if os.path.exists(f) else "só no histórico"
              print(f"{r} | {f} | {g['n']}x | linhas {sorted(x for x in g['lines'] if x)[:5]} | commits {sorted(g['commits'])[:4]} | {exists}")
          PY

      - name: Falhar se houver achados
        run: |
          if [ "${GITLEAKS_RC:-0}" != "0" ]; then
            echo "Gitleaks encontrou possíveis secrets (veja o resumo acima)."
            exit 1
          fi
