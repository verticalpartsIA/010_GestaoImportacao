name: CodeQL

# DESATIVADO: o Code scanning exige GitHub Code Security em repositórios
# privados, indisponível no plano atual. O workflow só roda manualmente.
# Para reativar, restaure os gatilhos abaixo:
#   push:         { branches: [main] }
#   pull_request: { branches: [main] }
#   schedule:     [{ cron: "17 6 * * 1" }]
on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # necessário para enviar os resultados ao Code Scanning
      security-events: write
      # necessário para ler workflows em repositórios privados
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
