name: CI — VP Gestão

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissões mínimas: o CI só lê o código.
permissions:
  contents: read

# Um novo push cancela o CI antigo da mesma branch/PR (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar estrutura do projeto
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: a checagem de ?v= compara com o commit base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # ESLint com regras de erro real (eslint.config.js). Erro falha o CI.
      - name: Lint
        run: npm run lint

      # Recompila os 4 bundles de PDF (Vite, ~6 s). Falha se algum build quebrar.
      - name: Build (bundles de PDF)
        run: npm run build

      # Os bundles gerados são versionados: se o resultado difere do commit,
      # alguém editou um .entry.js sem rodar o build (ou o inverso).
      - name: Bundles de PDF em dia com o código-fonte
        run: |
          if ! git diff --quiet -- src/*.bundle.js; then
            echo "❌ src/*.bundle.js difere do build. Rode 'npm run build' e commite:"
            git diff --stat -- src/*.bundle.js
            exit 1
          fi
          echo "✅ Bundles de PDF idênticos ao build."

      # Testes reais: node --test em src/*.test.js (ver scripts/run-tests.js).
      - name: Testes unitários (node --test)
        run: npm run test

      # Informativo (sem limite mínimo): cobertura nativa do Node.
      - name: Cobertura (informativo)
        continue-on-error: true
        run: node --test --experimental-test-coverage src/*.test.js 2>&1 | tail -30

      - name: Cache-busting (?v=) incrementado nos arquivos alterados
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-cache-bust.js "$BASE_SHA"

      - name: Verificar arquivos críticos
        run: |
          echo "Verificando arquivos obrigatórios..."
          test -f index.html       && echo "✅ index.html"       || (echo "❌ index.html ausente"  && exit 1)
          test -f src/app.jsx      && echo "✅ src/app.jsx"      || (echo "❌ src/app.jsx ausente" && exit 1)
          test -f src/supabase.js  && echo "✅ src/supabase.js"  || (echo "❌ supabase.js ausente" && exit 1)
          test -f server.js        && echo "✅ server.js"        || (echo "❌ server.js ausente"   && exit 1)
          echo "Todos os arquivos críticos presentes."

      - name: Verificar ausência de secrets no código
        run: |
          echo "Checando service_role key..."
          if grep -r "service_role" src/ --include="*.js" --include="*.jsx" -l 2>/dev/null; then
            echo "❌ ERRO: service_role key encontrada no frontend!"
            exit 1
          fi
          echo "✅ Nenhuma service_role key no frontend."

      - name: Checar referências a 'próxima fase' / 'em breve' no código de ação
        run: |
          echo "Checando toasts de 'próxima fase'..."
          if grep -r "próxima fase\|em breve" src/ --include="*.jsx" -l 2>/dev/null | grep -v shell.jsx; then
            echo "⚠️  WARN: encontradas referências a funcionalidades não implementadas"
          else
            echo "✅ Sem placeholders de 'próxima fase'."
          fi
